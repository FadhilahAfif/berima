# Phase 5 stub: CreateReviewScreen.
# Reachable only when an order has status = paid AND hasReview = false.
# This flow assumes such an order exists (seeded). Customise the locator below.
appId: upnvj.berima.v1
tags:
  - review
  - phase5
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${BERIMA_TEST_EMAIL}
      PASSWORD: ${BERIMA_TEST_PASSWORD}

# Open the Pesanan tab
- tapOn:
    text: "Pesanan"
- extendedWaitUntil:
    visible: "Sebagai Pembeli"
    timeout: 8000

# TODO: replace with the title of a seeded paid order that has no review yet
- scrollUntilVisible:
    element:
      text: "TODO_PAID_ORDER_TITLE"
    direction: DOWN
    timeout: 8000
    speed: 60
- tapOn:
    text: "TODO_PAID_ORDER_TITLE"
- extendedWaitUntil:
    visible: "Tulis Ulasan"
    timeout: 8000
- takeScreenshot: 63-create-review-01-detail

- tapOn:
    text: "Tulis Ulasan"
- extendedWaitUntil:
    visible: "Tulis Ulasan"
    timeout: 5000
- takeScreenshot: 63-create-review-02-empty

# TODO: tap the 5th star. The exact target depends on whether stars are
# rendered as buttons with content descriptions, an indexed list, etc.
# Verify the locator by inspecting CreateReviewScreen.kt.
- tapOn:
    id: "star-5"
    optional: true
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: 63-create-review-03-stars-selected

- tapOn:
    text: "Komentar"
    optional: true
- inputText: "Maestro QA review ${BERIMA_RUN_ID}"
- hideKeyboard
- takeScreenshot: 63-create-review-04-with-comment

# TODO: confirm the submit button label
- tapOn:
    text: "Kirim Ulasan"
    optional: true
- extendedWaitUntil:
    visible: "Pesanan"
    timeout: 15000
- takeScreenshot: 63-create-review-05-submitted
