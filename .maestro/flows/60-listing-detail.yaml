# ListingDetailScreen as a non-owner (buyer Dian views a seeded listing).
# Verifies: thumbnail area, title, price, delivery estimate, description,
# seller card, "Penjual" section header, "Pesan Sekarang" CTA (not Edit).
# Also taps "Lihat profil" arrow to open UserProfileScreen.
appId: upnvj.berima.v1
tags:
  - listing
  - phase5
---
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: ${BERIMA_TEST_EMAIL}
      PASSWORD: ${BERIMA_TEST_PASSWORD}

# Find any seeded listing on Home
- extendedWaitUntil:
    visible: "Terbaru"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ${BERIMA_TEST_LISTING_TITLE}
    direction: DOWN
    timeout: 10000
    speed: 60
- tapOn:
    text: ${BERIMA_TEST_LISTING_TITLE}
- extendedWaitUntil:
    visible: "Pesan Sekarang"
    timeout: 8000
- takeScreenshot: 60-detail-01-loaded

# Structure assertions
- assertVisible: "Estimasi selesai:"
- assertVisible: "Penjual"
- assertVisible: "Pesan Sekarang"
- assertNotVisible: "Edit Listing"

# Scroll to see description + reviews section
- scroll
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: 60-detail-02-scrolled

# Tap "Lihat profil" arrow on the seller card -> UserProfileScreen
- tapOn:
    text: "Lihat profil"
- extendedWaitUntil:
    visible: "Profil Penjual"
    timeout: 8000
- takeScreenshot: 60-detail-03-seller-profile
- assertVisible: "Listing Aktif"
- assertNotVisible: "Edit Profil"
- assertNotVisible: "Keluar"

# Back to listing detail
- back
- extendedWaitUntil:
    visible: "Pesan Sekarang"
    timeout: 5000
- takeScreenshot: 60-detail-04-back-on-detail

# Back to Home
- back
- extendedWaitUntil:
    visible: "Beranda"
    timeout: 5000
